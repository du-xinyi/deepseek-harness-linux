name: Linux Desktop release
run-name: Linux Desktop ${{ inputs.build_version }}

on:
  workflow_dispatch:
    inputs:
      build_version:
        description: '完整 Linux 版本号，例如 0.2.2-alpha.2.linux.2；必须高于已发布版本'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: linux-desktop-release
  cancel-in-progress: false

jobs:
  package:
    if: github.repository == 'du-xinyi/deepseek-harness-linux'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      BUILD_VERSION: ${{ inputs.build_version }}
      LINUX_ARCH: ${{ matrix.arch }}
      DSH_GATE_CONCURRENCY: '1'
      XZ_DEFAULTS: -T0
      DSH_DESKTOP_LINUX_UPDATE_URL: https://github.com/${{ github.repository }}/releases/latest/download/
      DSH_DESKTOP_UPDATE_CHANNEL: nightly
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5.0.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: pnpm
      - name: 安装 Linux 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libnss3 libasound2t64 libgbm1 libxss1 xvfb
      - run: pnpm install --frozen-lockfile
      - name: 构建并验证 Linux 安装包
        run: pnpm --dir apps/desktop run "package:linux:$LINUX_ARCH" --build-version "$BUILD_VERSION"
      - name: 验证更新下载和临时 AppImage 替换
        run: |
          # Hosted runners restrict unprivileged namespaces; configure Electron's SUID sandbox for this test binary.
          sandbox="apps/desktop/.desktop-build/targets/linux-$LINUX_ARCH/electron/chrome-sandbox"
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"
          xvfb-run --auto-servernum node apps/desktop/scripts/test-linux-updates.mjs
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: linux-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1
          path: |
            apps/desktop/.desktop-build/targets/linux-${{ matrix.arch }}/unsigned-artifacts/*.AppImage
            apps/desktop/.desktop-build/targets/linux-${{ matrix.arch }}/unsigned-artifacts/*.deb
            apps/desktop/.desktop-build/targets/linux-${{ matrix.arch }}/unsigned-artifacts/nightly-linux*.yml

  publish:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_VERSION: ${{ inputs.build_version }}
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: linux-*
          merge-multiple: true
          path: release
      - name: 发布完整更新批次
        run: |
          tag="linux-v$BUILD_VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "该版本已存在；请使用更高版本号。" >&2
            exit 1
          fi
          cat > release-notes.md <<'EOF'
          Linux 社区桌面发行版，提供 AppImage 和 deb。

          此版本包含应用内更新检查、SHA-512 下载校验及安装确认。deb 安装需要系统授权；AppImage 需要位于可写目录。
          EOF
          gh release create "$tag" release/* --target "$GITHUB_SHA" --latest --prerelease=false --title "Linux Desktop $BUILD_VERSION" --notes-file release-notes.md
